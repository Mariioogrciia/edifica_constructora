<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background:#0b1120; width:100%; height:100%;">
  <!-- Fondo y Grid -->
  <rect width="100%" height="100%" fill="#0b1120" />
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Muros exteriores -->
  <path d="M 50 50 L 750 50 L 750 550 L 50 550 Z" fill="none" stroke="#38bdf8" stroke-width="4" />
  
  <!-- Muros interiores -->
  <path d="M 50 250 L 300 250 L 300 50" fill="none" stroke="#38bdf8" stroke-width="2" />
  <path d="M 300 350 L 300 550" fill="none" stroke="#38bdf8" stroke-width="2" />
  <path d="M 500 50 L 500 200 L 750 200" fill="none" stroke="#38bdf8" stroke-width="2" />
  <path d="M 500 350 L 750 350" fill="none" stroke="#38bdf8" stroke-width="2" />

  <!-- Habitaciones (Textos sutiles) -->
  <g fill="rgba(56, 189, 248, 0.4)" font-family="sans-serif" font-size="14" font-weight="bold">
    <text x="120" y="150">ZONA DE CARGA</text>
    <text x="580" y="130">ACOPIO DE MATERIALES</text>
    <text x="150" y="400">PLANTA ALTA</text>
    <text x="580" y="450">SÓTANO</text>
    <text x="400" y="300" text-anchor="middle">ZONA CENTRAL / ENTRADA PRINCIPAL</text>
  </g>
  
  <!-- Puertas (Aperturas en los muros, marcadas en cyan suave) -->
  <rect x="300" y="250" width="4" height="100" fill="#0b1120" />
  <rect x="500" y="200" width="4" height="150" fill="#0b1120" />
</svg>
